<svg xmlns="http://www.w3.org/2000/svg" width="90mm" height="120mm" viewBox="0 0 360 480"><rect width="360" height="480" fill="#faf9f4"/><text x="35" y="58" font-family="Arial,sans-serif" font-size="8" fill="#6c8b7b" letter-spacing="2">CHARIM / A TEA DIARY</text><g font-family="Georgia,serif" font-size="24" fill="#252e2a"><text x="35" y="124">Something you would</text><text x="35" y="158">like to remember?</text></g><g font-family="Arial,sans-serif" font-size="12" fill="#68766d"><text x="35" y="220">The Charim Tea Diary offers space</text><text x="35" y="243">for the cup and the moment around it.</text><text x="35" y="294">A flavor.</text><text x="35" y="317">A place.</text><text x="35" y="340">A person who came to mind.</text><text x="35" y="422" fill="#6c8b7b">Available separately.</text></g></svg>