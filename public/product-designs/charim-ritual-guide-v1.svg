림</text><text x="327" y="93" fill="#171b1a" font-family="Georgia,serif" font-style="italic" font-size="34">02</text><g transform="translate(387,90) scale(.85)" fill="none" stroke="#171b1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M49 45q-9 47 32 47t33-47zM48 45h68M63 44q-5-21 18-21t23 21M78 23v-8h9v8M45 52 24 35l10 36 19 8M114 59h25v11h-25"/><path d="M74 12q-6-8 0-13m16 13q-6-8 0-13"/></g><text x="327" y="225" font-family="AppleMyungjo,Noto Serif KR,serif" font-size="20" fill="#171b1a">차를 우리다</text><text x="327" y="254" font-family="Georgia,serif" font-size="19" fill="#171b1a">Warm, then brew</text><text x="327" y="290" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Warm your teaware. Brew using</text><text x="327" y="308" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">your tea’s recommended water</text><text x="327" y="326" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">temperature and steeping time.</text><path d="M327 365h246" stroke="url(#pearl)" stroke-width="2"/><text x="327" y="389" font-family="Arial,sans-serif" font-size="7.5" fill="#626b66">SMALL MOMENTS. MEANINGFULLY MADE.</text><text x="627" y="36" fill="#171b1a" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">MILLION ROUTINES · 차림</text><text x="627" y="93" fill="#171b1a" font-family="Georgia,serif" font-style="italic" font-size="34">03</text><g transform="translate(687,90) scale(.85)" fill="none" stroke="#171b1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m41 22 18-13 49 23-19 42-40-19zM46 22 24 24l23 22M95 65q-6 8-7 14M65 85v21q14 16 29 0V85zM65 85q15 7 29 0"/></g><text x="627" y="225" font-family="AppleMyungjo,Noto Serif KR,serif" font-size="20" fill="#171b1a">마음을 담다</text><text x="627" y="254" font-family="Georgia,serif" font-size="19" fill="#171b1a">Pour with care</text><text x="627" y="290" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Pour a little into each cup in turn.</text><text x="627" y="308" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Offer a cup to someone,</text><text x="627" y="326" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">or keep this moment for yourself.</text><path d="M627 365h246" stroke="url(#pearl)" stroke-width="2"/><text x="627" y="389" font-family="Arial,sans-serif" font-size="7.5" fill="#626b66">SMALL MOMENTS. MEANINGFULLY MADE.</text><text x="927" y="36" fill="#171b1a" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">MILLION ROUTINES · 차림</text><text x="927" y="93" fill="#171b1a" font-family="Georgia,serif" font-style="italic" font-size="34">04</text><g transform="translate(987,90) scale(.85)" fill="none" stroke="#171b1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M47 42v40q27 25 53 0V42zM47 42q27 12 53 0M38 101h73M66 24q-10-10 0-20m20 20q-10-10 0-20"/></g><text x="927" y="225" font-family="AppleMyungjo,Noto Serif KR,serif" font-size="20" fill="#171b1a">한 잔에 머물다</text><text x="927" y="254" font-family="Georgia,serif" font-size="19" fill="#171b1a">Stay for a cup</text><text x="927" y="290" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Notice the aroma and warmth.</text><text x="927" y="308" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Take a sip, then take your time.</text><text x="927" y="326" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">There is room for quiet here.</text><path d="M927 365h246" stroke="url(#pearl)" stroke-width="2"/><text x="927" y="389" font-family="Arial,sans-serif" font-size="7.5" fill="#626b66">SMALL MOMENTS. MEANINGFULLY MADE.</text></svg>