<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" role="img" aria-labelledby="guide-title guide-desc" viewBox="0 0 1200 420"><title id="guide-title">Million Routines · four small tea rituals</title><desc id="guide-desc">Four panels with refined line drawings of the rounded Bloom cup and side-handle teapot: make room, brew, pour and stay.</desc><defs><linearGradient id="pearl"><stop stop-color="#aabeb7"/><stop offset=".32" stop-color="#e4d2db"/><stop offset=".65" stop-color="#b7b1c9"/><stop offset="1" stop-color="#d5dfd2"/></linearGradient><g id="bloom-flower" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M0-4C-3-8-7-4-5-1C-9 1-6 6-2 4C0 8 5 6 4 2C9 1 7-4 3-3C3-7-1-8 0-4Z"/><circle r=".6" fill="currentColor" stroke="none"/></g>
<g id="bloom-cup" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10C-1 29 3 50 21 57C30 61 43 61 52 57C69 50 74 29 68 10"/><ellipse cx="36" cy="10" rx="32" ry="8"/><path d="M22 58L23 62Q36 66 49 62L50 58"/><use href="#bloom-flower" transform="translate(36 46) scale(.58)"/></g>
