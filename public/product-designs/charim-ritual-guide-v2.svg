TURE</text><text x="327" y="36" fill="#171b1a" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">MILLION ROUTINES · 차림</text><text x="327" y="93" fill="#171b1a" font-family="Georgia,serif" font-style="italic" font-size="34">02</text><g transform="translate(383 102)" color="#171b1a"><use href="#side-pot" transform="translate(17 0)"/><path d="M60 3Q55-3 60-9M75 3Q70-3 75-9" fill="none" stroke="#171b1a" stroke-width="1.25" stroke-linecap="round"/></g><text x="327" y="225" font-family="AppleMyungjo,Noto Serif KR,serif" font-size="20" fill="#171b1a">차를 우리다</text><text x="327" y="254" font-family="Georgia,serif" font-size="19" fill="#171b1a">Warm, then brew</text><text x="327" y="290" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Warm your teaware. Brew using</text><text x="327" y="308" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">your tea’s recommended water</text><text x="327" y="326" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">temperature and steeping time.</text><path d="M327 365h246" stroke="url(#pearl)" stroke-width="2"/><text x="327" y="389" font-family="Arial,sans-serif" font-size="7.5" fill="#626b66">SMALL MOMENTS. MEANINGFULLY MADE.</text><text x="627" y="36" fill="#171b1a" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">MILLION ROUTINES · 차림</text><text x="627" y="93" fill="#171b1a" font-family="Georgia,serif" font-style="italic" font-size="34">03</text><g transform="translate(689 80)" color="#171b1a"><use href="#side-pot" transform="translate(50 0) scale(.72) rotate(-25 50 50)"/><path d="M52 44Q44 60 44 81" fill="none" stroke="#486f60" stroke-width="1.25" stroke-linecap="round"/><use href="#bloom-cup" transform="translate(18 75) scale(.72)"/></g><text x="627" y="225" font-family="AppleMyungjo,Noto Serif KR,serif" font-size="20" fill="#171b1a">마음을 담다</text><text x="627" y="254" font-family="Georgia,serif" font-size="19" fill="#171b1a">Pour with care</text><text x="627" y="290" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Pour a little into each cup in turn.</text><text x="627" y="308" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Offer a cup to someone,</text><text x="627" y="326" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">or keep this moment for yourself.</text><path d="M627 365h246" stroke="url(#pearl)" stroke-width="2"/><text x="627" y="389" font-family="Arial,sans-serif" font-size="7.5" fill="#626b66">SMALL MOMENTS. MEANINGFULLY MADE.</text><text x="927" y="36" fill="#171b1a" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">MILLION ROUTINES · 차림</text><text x="927" y="93" fill="#171b1a" font-family="Georgia,serif" font-style="italic" font-size="34">04</text><g transform="translate(1000 119)" color="#171b1a"><use href="#bloom-cup"/><path d="M26-10Q20-17 26-25M44-10Q38-17 44-25" fill="none" stroke="#171b1a" stroke-width="1.25" stroke-linecap="round"/><path d="M10 77H62" fill="none" stroke="#aebeb5" stroke-width="1"/></g><text x="927" y="225" font-family="AppleMyungjo,Noto Serif KR,serif" font-size="20" fill="#171b1a">한 잔에 머물다</text><text x="927" y="254" font-family="Georgia,serif" font-size="19" fill="#171b1a">Stay for a cup</text><text x="927" y="290" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Notice the aroma and warmth.</text><text x="927" y="308" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">Take a sip, then take your time.</text><text x="927" y="326" font-family="Arial,sans-serif" font-size="10.5" fill="#626b66">There is room for quiet here.</text><path d="M927 365h246" stroke="url(#pearl)" stroke-width="2"/><text x="927" y="389" font-family="Arial,sans-serif" font-size="7.5" fill="#626b66">SMALL MOMENTS. MEANINGFULLY MADE.</text></svg>