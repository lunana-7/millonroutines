<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tea in Watercolor — Charim</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e6;color:#284b3d;font:14px/1.8 Georgia,serif}main{max-width:1200px;margin:35px auto;padding:24px}h1{font-size:clamp(28px,5vw,48px);font-weight:400;margin:0 0 8px}p{margin:0 0 22px;color:#617763}canvas{width:100%;height:auto;display:block;border:1px solid #d9ddca}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}button{padding:13px 24px;background:#284b3d;color:#faf7ec;border:0;font:13px Georgia,serif;cursor:pointer}button:disabled{opacity:.5}a{color:inherit}small{display:block;margin-top:16px}</style></head><body><main><h1>Water finds its way.</h1><p>Pour the tea. Water flows, pigment drifts, and a Korean ink landscape catches a little pearl light.</p><canvas width="1200" height="700" aria-label="Animated Korean watercolor tea painting"></canvas><nav><button id="play">Pour the tea</button><button id="save">Save animation · WebM</button><a id="download" hidden>Download the recorded animation</a><a href="/ritual#nacre-pour">Return to Charim ↗</a></nav><small id="state" role="status">Original procedural watercolor · approximately 11 seconds · no external assets</small></main><script type="module">
import{createWatercolorScene}from'./tea-watercolor-v3.js';
const canvas=document.querySelector('canvas'),play=document.querySelector('#play'),save=document.querySelector('#save'),state=document.querySelector('#state'),link=document.querySelector('#download');
let recorder=null,url=null;const scene=createWatercolorScene(canvas,()=>{play.disabled=false;play.textContent='Pour again';save.disabled=false;state.textContent='The painting is complete.';if(recorder?.state==='recording')recorder.stop()});
play.onclick=()=>{play.disabled=true;state.textContent='Water flows. Pigment drifts.';scene.play()};
if(!window.MediaRecorder||!canvas.captureStream)save.hidden=true;
save.onclick=()=>{if(url)URL.revokeObjectURL(url);const type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!type){state.textContent='Recording is not available in this browser.';return}const chunks=[];const stream=canvas.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:5000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{url=URL.createObjectURL(new Blob(chunks,{type}));link.href=url;link.download='Charim-Watercolor-Tea-Animation.webm';link.hidden=false;state.textContent='Your animation is ready to download.';stream.getTracks().forEach(t=>t.stop())};play.disabled=true;save.disabled=true;link.hidden=true;state.textContent='Recording the moving watercolor…';recorder.start();scene.play()};
</script></body></html>
